<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ZDC</title>

    <link rel="icon" type="image/png" href="./assets/icons/zdc-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/tailwind.min.css">
    <script src="js/custom-dialogs.js"></script>
    <style>
        html, body { overflow-x: hidden; max-width: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0D0D0D; color: #EFECE6; }
        h1, h2 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-b-primary/10 rounded-full blur-[110px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-b-primary/5 rounded-full blur-[110px]"></div>
    </div>

    <div class="bg-b-surface border border-b-border p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full relative z-10 animate-fade-in">

        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-b-border via-b-primary to-b-border"></div>

        <div class="text-center mb-8">
            <div class="flex justify-center mb-5 animate-float">
                <div class="relative">
                    <img src="./assets/icons/zdc-icon-192.png" alt="ZDC Logo" class="w-20 h-20 rounded-2xl shadow-xl border border-b-border object-cover" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=ZDC&background=161616&color=EFECE6'">
                    <div class="absolute -bottom-2 -right-2 w-8 h-8 bg-b-surface-card rounded-full flex items-center justify-center border border-b-border text-b-primary text-sm shadow-lg">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                </div>
            </div>
            <h1 class="text-3xl font-black headline-gradient mb-1 tracking-wide">ZDC</h1>
            <h2 class="text-lg font-bold text-b-text mt-4">Reset Your Password</h2>
            <p class="text-xs text-gray-400 mt-2 leading-relaxed">Enter a new password for your account and store it in a safe place.</p>
        </div>

        <form id="reset-password-form" class="space-y-5">
            <div>
                <label class="block text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wider">New Password</label>
                <div class="relative group">
                    <input type="password" id="new-password" required minlength="6" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-b-primary focus:ring-1 focus:ring-b-primary outline-none pl-10 transition-all" placeholder="••••••••">
                    <i class="fas fa-lock absolute left-4 top-3.5 text-gray-500 group-focus-within:text-b-primary transition-colors"></i>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Confirm Password</label>
                <div class="relative group">
                    <input type="password" id="confirm-password" required minlength="6" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-b-primary focus:ring-1 focus:ring-b-primary outline-none pl-10 transition-all" placeholder="••••••••">
                    <i class="fas fa-check-double absolute left-4 top-3.5 text-gray-500 group-focus-within:text-b-primary transition-colors"></i>
                </div>
            </div>

            <div id="error-message" class="hidden text-red-400 text-xs bg-red-500/10 p-3 rounded-lg border border-red-500/20 text-center font-bold flex items-center justify-center gap-2">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3.5 mt-2 bg-gradient-to-r from-b-primary to-teal-700 hover:from-teal-600 hover:to-teal-800 text-white font-bold rounded-xl shadow-lg shadow-b-primary/20 transition-all flex items-center justify-center gap-2 group">
                <i class="fas fa-key group-hover:scale-110 transition-transform"></i>
                <span>Save New Password</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <a href="./pages/auth.html" class="inline-flex items-center justify-center gap-2 text-gray-400 hover:text-white text-sm font-bold transition-colors group">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                <span>Back to Sign In</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-config.js';

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reset-password-form');
            const newPassInput = document.getElementById('new-password');
            const confirmPassInput = document.getElementById('confirm-password');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');

            function showError(msg) {
                errorText.innerText = msg;
                errorDiv.classList.remove('hidden');
            }

            if (!window.location.hash.includes('type=recovery')) {
                showError("Invalid or expired recovery link. Please request a new reset link.");
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.classList.add('hidden');

                const newPassword = newPassInput.value;
                const confirmPassword = confirmPassInput.value;

                if (newPassword !== confirmPassword) {
                    showError("Passwords do not match.");
                    return;
                }

                if (newPassword.length < 6) {
                    showError("Password must be at least 6 characters long.");
                    return;
                }

                const originalBtnContent = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Updating...</span>';
                btnSubmit.disabled = true;

                try {
                    const { error } = await supabase.auth.updateUser({
                        password: newPassword
                    });

                    if (error) throw error;

                    btnSubmit.innerHTML = '<i class="fas fa-check-circle text-xl"></i> <span>Password Updated!</span>';
                    btnSubmit.className = "w-full py-3.5 mt-2 bg-green-600 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2";

                    newPassInput.disabled = true;
                    confirmPassInput.disabled = true;

                    setTimeout(() => {
                        window.location.href = './pages/auth.html';
                    }, 2000);

                } catch (error) {
                    console.error("Password Update Error:", error);
                    showError(error.message || "Failed to update password.");
                    btnSubmit.innerHTML = originalBtnContent;
                    btnSubmit.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
