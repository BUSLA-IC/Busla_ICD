<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Team Account Activation | ZDC</title>
    <link rel="icon" type="image/png" href="../../assets/icons/zdc-icon-192.png">
    <link rel="stylesheet" href="../../css/tailwind.min.css">
    <script src="../../js/custom-dialogs.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0D0D0D; color: #EFECE6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-[url('../assets/patterns/circuit.png')] bg-opacity-5 relative">

    <div class="bg-b-surface border border-b-border p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full relative z-10 mx-4">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-b-surface-card text-b-primary rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 border border-b-border shadow-lg">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">Activate Admin Account</h1>
            <p class="text-sm text-gray-400" id="welcome-text">Verifying your application...</p>
        </div>

        <form id="team-setup-form" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">Create a password for your ZDC account</label>
                <div class="relative">
                    <input type="password" id="new-password" required minlength="6" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-b-primary outline-none pl-10 text-left" dir="ltr" placeholder="••••••••">
                    <i class="fas fa-lock absolute left-4 top-3.5 text-gray-500"></i>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3.5 mt-2 bg-b-primary hover:bg-teal-600 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fas fa-rocket"></i> Reserve Account & Verify Email
            </button>
        </form>

        <div id="status-box" class="hidden text-center p-4 rounded-xl mt-4 font-bold text-sm"></div>
    </div>

    <script type="module">
        import { supabase } from '../../js/supabase-config.js';

        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');
        const welcomeText = document.getElementById('welcome-text');
        const form = document.getElementById('team-setup-form');
        const statusBox = document.getElementById('status-box');
        const btn = document.getElementById('btn-submit');

        async function verifyApplicant() {
            if (!userEmail) return welcomeText.innerText = "Invalid invitation link.";
            
            try {
                const { data, error } = await supabase
                    .from('admin_applications')
                    .select('full_name, application_status')
                    .ilike('email', userEmail.trim()) 
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    throw new Error("No core team application was found for this email address.");
                }

                if (data.application_status !== 'accepted') {
                    throw new Error("This application is registered but has not been approved yet.");
                }
                
                welcomeText.innerHTML = `Welcome, <span class="text-teal-400 font-bold">${data.full_name}</span>.<br>Create a password for your new ZDC admin account.`;
                form.classList.remove('hidden');

            } catch (err) {
                console.error("Verification Error:", err);
                welcomeText.innerText = "Sorry, " + err.message;
            }
        }
        verifyApplicant();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            btn.disabled = true;

            const password = document.getElementById('new-password').value;

            try {
                const { data, error } = await supabase.auth.signUp({ 
                    email: userEmail, 
                    password: password 
                });
                if (error) throw error;

                form.classList.add('hidden');
                statusBox.classList.remove('hidden');
                statusBox.classList.add('bg-green-500/20', 'border', 'border-green-500', 'text-green-400');
                statusBox.innerHTML = 'Your account has been reserved!<br><br><span class="text-white text-xs">We sent a confirmation link to your email address. Please click the link inside to activate your ZDC admin access.</span>';

            } catch (err) {
                statusBox.classList.remove('hidden');
                statusBox.classList.add('bg-red-500/20', 'border', 'border-red-500', 'text-red-400');
                statusBox.innerText = "Error: " + err.message;
                btn.innerHTML = '<i class="fas fa-rocket"></i> Reserve Account & Verify Email';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
